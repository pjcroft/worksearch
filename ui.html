<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WorkSearch</title>
<style>
:root{
  --bg:#0b1220; --panel:#111c30; --panel2:#16233f;
  --text:#e8eefc; --muted:#93a4c4; --line:#26365a;
  --accent:#22d3ee; --accent2:#f59e0b; --tan:#d9c7a5;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--bg);min-height:100vh}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 82%,transparent);padding:1.1rem 1.5rem .8rem}
.wrap{max-width:1000px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:.8rem;margin-bottom:.7rem}
.brand h1{margin:0;font-size:1.15rem}.brand h1 span{color:var(--accent)}
.brand small{color:var(--muted)}
.rootbtn{display:inline-flex;align-items:center;gap:.5rem;max-width:min(560px,70vw);background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:.25rem .65rem;font:inherit;font-size:.8rem;cursor:pointer}
.rootbtn:hover{border-color:var(--accent);color:var(--text)}
.rootbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.rootbtn b{color:var(--accent);font-weight:600;white-space:nowrap}
.banner .btn{margin-left:.6rem}
#fdlg{width:min(680px,94vw)}
#fdlg h3{margin:.1rem 0 .2rem}
.frow{display:flex;gap:.5rem;margin:.6rem 0;align-items:center}
.frow input[type=text]{flex:1;min-width:0;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:.5rem .7rem;font:inherit;font-size:.9rem}
.frow input[type=text]:focus{outline:none;border-color:var(--accent)}
.frow select{flex:1;max-width:none}
.flist{height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.flist div{padding:.45rem .8rem;border-bottom:1px solid rgba(38,54,90,.5);cursor:pointer;font-size:.88rem;display:flex;gap:.55rem}
.flist div:hover{background:var(--panel2)}
.flist div:before{content:"📁";opacity:.8}
.flist div.up:before{content:"↰"}
.flist .none{cursor:default;color:var(--muted);font-style:italic}.flist .none:before{content:""}.flist .none:hover{background:none}
.fnote{font-size:.82rem;color:var(--muted);margin:.6rem 0}
.fnote.bad{color:#fca5a5}
.fbtns{display:flex;gap:.6rem;justify-content:flex-end;margin-top:.8rem}
.btn.primary{background:rgba(34,211,238,.16);border-color:var(--accent);color:var(--accent)}
.search{position:relative}
.search input{width:100%;padding:.95rem 1.1rem .95rem 2.8rem;font:inherit;font-size:1.15rem;color:var(--text);background:var(--panel);border:1.5px solid var(--line);border-radius:14px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,211,238,.15)}
.search:before{content:"⌕";position:absolute;left:1rem;top:.55rem;font-size:1.6rem;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:.5rem .7rem;align-items:center;margin-top:.7rem}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:.28rem .75rem;border-radius:999px;font:inherit;font-size:.82rem;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--text)}
.chip.on{background:rgba(34,211,238,.14);border-color:var(--accent);color:var(--accent)}
select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:.3rem .5rem;font:inherit;font-size:.82rem;max-width:230px}
.sp{flex:1}
main{max-width:calc(1000px + 3rem);margin:0 auto;padding:0 1.5rem 5rem}
.banner{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.4);color:#fcd89a;border-radius:10px;padding:.6rem .9rem;margin:.4rem 0 .8rem;font-size:.88rem}
.banner.bad{background:rgba(229,72,77,.1);border-color:rgba(229,72,77,.45);color:#fca5a5}
.count{color:var(--muted);font-size:.82rem;margin:.5rem 0 .6rem}
.res{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem;margin-bottom:.7rem;cursor:pointer;transition:.12s}
.res:hover,.res.sel{border-color:var(--accent);background:var(--panel2)}
.rh{display:flex;gap:.7rem;align-items:center}
.ext{flex:none;min-width:2.9rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.05em;padding:.28rem .4rem;border-radius:6px;text-transform:uppercase;background:#1e293b;color:#cbd5e1}
.k-pdf{background:rgba(229,72,77,.2);color:#ff9a9d}.k-word{background:rgba(59,130,246,.22);color:#93c5fd}.k-excel{background:rgba(22,163,74,.22);color:#86efac}
.k-slides{background:rgba(245,158,11,.22);color:#fcd34d}.k-email{background:rgba(167,139,250,.22);color:#c4b5fd}
.nm{font-weight:650;font-size:1rem;word-break:break-word}
.path{color:var(--muted);font-size:.8rem;margin:.15rem 0 0;word-break:break-all}
.snip{margin:.55rem 0 0;font-size:.9rem;line-height:1.55;color:#c9d6f0;border-left:2px solid var(--line);padding-left:.7rem}
.snip b{color:var(--tan);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;margin-right:.4rem}
mark{background:rgba(245,158,11,.3);color:#fde68a;border-radius:3px;padding:0 1px}
.meta{display:flex;flex-wrap:wrap;gap:.3rem 1rem;align-items:center;margin-top:.6rem;color:var(--muted);font-size:.78rem}
.act{margin-left:auto;display:flex;gap:.4rem}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:.28rem .7rem;border-radius:8px;font:inherit;font-size:.8rem;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.warn{color:#fbbf24}
.more{display:block;margin:1rem auto;padding:.5rem 1.4rem}
.empty{text-align:center;color:var(--muted);padding:3rem 1rem}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:.45rem 1.5rem;font-size:.78rem;color:var(--muted);z-index:6}
.foot .wrap{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#34d399;margin-right:.4rem}
.dot.busy{background:var(--accent2);animation:p 1.2s infinite}
@keyframes p{50%{opacity:.35}}
.foot a{color:var(--accent);cursor:pointer;text-decoration:none}
.toast{position:fixed;left:50%;bottom:3.2rem;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);padding:.5rem 1rem;border-radius:10px;font-size:.85rem;z-index:9;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;max-width:760px;width:92vw;max-height:70vh}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog li{margin:.25rem 0;font-size:.85rem;word-break:break-all}
dialog small{color:var(--muted)}
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <div class="brand"><h1>Work<span>Search</span></h1><button class="rootbtn" id="rootname" title="Change the folder WorkSearch searches"><b>Folder:</b><span></span></button></div>
  <div class="search"><input id="q" type="search" placeholder="Search file names and contents…  (press / to focus)" autocomplete="off" autofocus></div>
  <div class="filters" id="filters">
    <button class="chip on" data-t="">All</button>
    <button class="chip" data-t="pdf">PDF</button><button class="chip" data-t="word">Word</button>
    <button class="chip" data-t="excel">Excel</button><button class="chip" data-t="slides">Slides</button>
    <button class="chip" data-t="email">Email</button><button class="chip" data-t="cad">CAD</button><button class="chip" data-t="image">Images</button>
    <select id="folder" title="Limit to a top-level folder"><option value="">All folders</option></select>
    <span class="sp"></span>
    <select id="sort"><option value="relevance">Best match</option><option value="newest">Newest first</option></select>
  </div>
</div></div>
<main>
  <div id="banners"></div>
  <div class="count" id="count"></div>
  <div id="results"></div>
  <button class="btn more" id="more" style="display:none">Show more</button>
</main>
<div class="foot"><div class="wrap">
  <span id="stat"><span class="dot"></span>Starting…</span><span class="sp"></span>
  <a id="problems" style="display:none"></a><a id="rescan">Rescan now</a><a id="quit" title="Stop WorkSearch (it stops indexing too)">Quit</a>
</div></div>
<div class="toast" id="toast"></div>
<dialog id="fdlg">
  <h3>Choose the folder to search</h3>
  <div class="fnote">WorkSearch will read everything inside this folder. Your files are never changed.</div>
  <div class="frow"><select id="fvol" title="Mounted drives and shares"><option value="">Mounted drives and shares…</option></select></div>
  <div class="frow"><input type="text" id="fpath" spellcheck="false" placeholder="/Volumes/Qnap/Work"><button class="btn" id="fgo">Go</button></div>
  <div class="flist" id="flist"></div>
  <div class="fnote" id="fmsg"></div>
  <div class="fbtns"><button class="btn" id="fcancel">Cancel</button><button class="btn primary" id="fuse">Use this folder</button></div>
</dialog>
<dialog id="dlg"><h3 style="margin-top:0">Files with limited search</h3><small>Name-only files can be found by name but not by contents. Errors could not be read at all.</small><ul id="plist"></ul><button class="btn" onclick="dlg.close()">Close</button></dialog>
<script>
const TOKEN='__TOKEN__';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let REVEAL='Show in Finder';
let type='',offset=0,lastQ=null,items=[],sel=-1,timer,reqId=0;
const LIMIT=30;

function terms(q){return (q.match(/"[^"]+"|[^\s"]+/g)||[]).map(t=>t.replace(/"/g,'')).flatMap(t=>t.split(/[^\p{L}\p{N}]+/u)).filter(t=>t.length>=2);}
function hi(text,ts){
  let h=esc(text);
  for(const t of ts){h=h.replace(new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>');}
  return h;
}
function snip(s){return esc(s).replace(/\u0001/g,'<mark>').replace(/\u0002/g,'</mark>').replace(/\n+/g,' ');}
function size(n){return n>1e9?(n/1e9).toFixed(1)+' GB':n>1e6?(n/1e6).toFixed(1)+' MB':Math.max(1,Math.round(n/1e3))+' KB';}
function date(t){return new Date(t*1000).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}

async function run(reset=true){
  const q=$('#q').value.trim(), my=++reqId;
  if(reset){offset=0;items=[];sel=-1;}
  const url='/api/search?'+new URLSearchParams({q,type,folder:$('#folder').value,sort:$('#sort').value,limit:LIMIT,offset});
  const r=await (await fetch(url)).json();
  if(my!==reqId)return;
  lastQ=q;
  items=items.concat(r.results);
  offset=items.length;
  render(r,q);
}
function render(r,q){
  const ts=terms(q);
  if(!r.recent&&!r.total&&q.replace(/["\s]/g,'').length<3){$('#count').textContent='Keep typing…';$('#results').innerHTML='';$('#more').style.display='none';return;}
  $('#count').textContent=r.error?('Search problem: '+r.error):r.recent?`Recently changed files (${r.total.toLocaleString()} total)`:`${r.total.toLocaleString()}${r.capped?'+':''} file${r.total===1&&!r.capped?'':'s'} match${r.total===1&&!r.capped?'es':''}${r.capped?' (showing the best; add a word to narrow it down)':''}`;
  $('#results').innerHTML=items.length?items.map((f,i)=>{
    const hits=f.hits.map(h=>`<div class="snip"><b>${esc(h.label)}</b>${snip(h.snip)}</div>`).join('');
    const warn=f.status==='error'?`<span class="warn">Could not read: ${esc(f.note)}</span>`:f.status==='name-only'?`<span class="warn" title="${esc(f.note)}">name only</span>`:f.ocr_left?`<span class="warn">${f.ocr_left} scanned page${f.ocr_left===1?'':'s'} still being read</span>`:'';
    return `<div class="res${i===sel?' sel':''}" data-i="${i}"><div class="rh"><span class="ext k-${f.kind}">${esc(f.ext||'file')}</span><div><div class="nm">${hi(f.name,ts)}</div><div class="path">${hi(f.dir||'/',ts)}</div></div></div>${hits}
      <div class="meta"><span>${date(f.mtime)}</span><span>${size(f.size)}</span>${warn}<span class="act"><button class="btn" data-a="open">Open</button><button class="btn" data-a="reveal">${REVEAL}</button><button class="btn" data-a="copy">Copy path</button></span></div></div>`;
  }).join(''):`<div class="empty">${q?'No matches. Try fewer or different words, or check the folder filter.':'Nothing indexed yet.'}</div>`;
  $('#more').style.display=items.length<r.total?'block':'none';
}
$('#results').addEventListener('click',async e=>{
  const card=e.target.closest('.res'); if(!card)return;
  const f=items[+card.dataset.i], a=e.target.dataset.a||'open';
  if(a==='copy'){
    const full=($('#rootname').dataset.root||'')+'/'+f.rel;
    try{await navigator.clipboard.writeText(full);toast('Path copied');}catch(_){toast(full);}
    return;
  }
  const r=await fetch('/api/open',{method:'POST',headers:{'X-WS-Token':TOKEN,'Content-Type':'application/json'},body:JSON.stringify({id:f.id,mode:a})});
  const j=await r.json(); toast(r.ok?(a==='reveal'?'Showing in '+(REVEAL.endsWith('Finder')?'Finder':'folder'):'Opening…'):(j.error||'Could not open'));
});
$('#more').onclick=()=>run(false);
$('#q').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(run,160);});
$('#sort').onchange=()=>run();$('#folder').onchange=()=>run();
$('#filters').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;
  document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));type=c.dataset.t;run();});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==$('#q')){e.preventDefault();$('#q').focus();return;}
  if(e.key==='Escape'){$('#q').select();return;}
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    if(!items.length)return;e.preventDefault();
    sel=Math.max(0,Math.min(items.length-1,sel+(e.key==='ArrowDown'?1:-1)));
    document.querySelectorAll('.res').forEach((c,i)=>c.classList.toggle('sel',i===sel));
    const c=document.querySelectorAll('.res')[sel];if(c)c.scrollIntoView({block:'nearest'});
  }
  if(e.key==='Enter'&&sel>=0){const c=document.querySelectorAll('.res')[sel];if(c)c.click();}
});
$('#rescan').onclick=async()=>{await fetch('/api/rescan',{method:'POST',headers:{'X-WS-Token':TOKEN}});toast('Rescanning…');status();};

$('#quit').onclick=async()=>{if(!confirm('Quit WorkSearch? Indexing stops until you open it again.'))return;
  await fetch('/api/quit',{method:'POST',headers:{'X-WS-Token':TOKEN}});
  document.body.innerHTML='<div class="empty" style="padding-top:20vh">WorkSearch has stopped. Open it again from your Applications to search.</div>';};
/* ---- folder picker ---- */
let fcur='';
const fdlg=$('#fdlg');
async function fbrowse(path){
  const r=await (await fetch('/api/browse?'+new URLSearchParams({path:path||''}))).json();
  fcur=r.path; $('#fpath').value=r.path;
  const L=$('#flist'); L.innerHTML='';
  if(r.parent){const d=document.createElement('div');d.className='up';d.textContent='.. (up one level)';d.onclick=()=>fbrowse(r.parent);L.appendChild(d);}
  r.dirs.forEach(n=>{const d=document.createElement('div');d.textContent=n;d.onclick=()=>fbrowse(r.path.replace(/\/$/,'')+'/'+n);L.appendChild(d);});
  if(!r.dirs.length&&!r.error){const d=document.createElement('div');d.className='none';d.textContent='No sub-folders here. You can use this folder.';L.appendChild(d);}
  const m=$('#fmsg'); m.className='fnote'+(r.error?' bad':''); m.textContent=r.error||(r.truncated?'Showing the first 1000 folders.':'');
  const sel=$('#fvol'); sel.innerHTML='<option value="">Mounted drives and shares…</option>'+r.volumes.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');
}
async function openFolderDialog(){
  fdlg.showModal(); await fbrowse($('#rootname').dataset.root||'');
}
$('#rootname').onclick=openFolderDialog;
$('#fvol').onchange=e=>{if(e.target.value)fbrowse(e.target.value);};
$('#fgo').onclick=()=>fbrowse($('#fpath').value.trim());
$('#fpath').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();fbrowse($('#fpath').value.trim());}});
$('#fcancel').onclick=()=>fdlg.close();
$('#fuse').onclick=async()=>{
  const path=$('#fpath').value.trim(), cur=$('#rootname').dataset.root||'';
  if(path!==cur&&!confirm('Search '+path+'?\n\nWorkSearch will forget what it indexed from the old folder and read this one from scratch.'))return;
  const r=await fetch('/api/setroot',{method:'POST',headers:{'X-WS-Token':TOKEN,'Content-Type':'application/json'},body:JSON.stringify({path})});
  const j=await r.json();
  if(!r.ok){const m=$('#fmsg');m.className='fnote bad';m.textContent=j.error||'Could not use that folder.';return;}
  fdlg.close(); toast(path===cur?'Rescanning…':'Folder changed. Reading files…');
  items=[];lastFiles=-1;await status();await folders();$('#q').value='';run();
};
let lastFiles=-1;
async function status(){
  try{
    const s=await (await fetch('/api/status')).json();
    $('#rootname').querySelector('span').textContent='\u202a'+s.root; $('#rootname').dataset.root=s.root; $('#rootname').title=s.root+'\n(click to change)';
    if(s.platform==='linux'&&REVEAL!=='Show in folder'){REVEAL='Show in folder';if(items.length)render({total:items.length,results:[]},lastQ||'');}
    const busy=s.phase!=='idle'||s.ocr_left>0;
    let t=`<span class="dot${busy?' busy':''}"></span>`;
    if(s.phase==='listing')t+=`Looking through folders… ${s.done.toLocaleString()} files found`;
    else if(s.phase==='reading')t+=`Reading files ${s.done.toLocaleString()} / ${s.total.toLocaleString()}`;
    else t+=`${s.files.toLocaleString()} files · ${s.pages.toLocaleString()} pages indexed`;
    if(s.ocr_left>0)t+=` · ${s.ocr_left.toLocaleString()} scanned pages waiting for OCR`;
    if(s.phase==='idle'&&s.last_scan)t+=` · last scan ${new Date(s.last_scan*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`;
    $('#stat').innerHTML=t;
    const b=[];
    if(!s.root_ok||s.error)b.push(`<div class="banner bad">${esc(s.error||'Folder not available')}<button class="btn" onclick="openFolderDialog()">Change folder…</button></div>`);
    if(!s.tesseract)b.push(`<div class="banner">Scanned PDFs are not being read yet because Tesseract (OCR) is not installed. In a terminal run: <b>${s.platform==='mac'?'brew install tesseract':'sudo apt install tesseract-ocr'}</b>, then quit and reopen WorkSearch.</div>`);
    $('#banners').innerHTML=b.join('');
    const p=s.errors+s.name_only;const a=$('#problems');
    a.style.display=p?'inline':'none';a.textContent=`${p.toLocaleString()} files with limited search`;
    if(s.files!==lastFiles&&(lastFiles<0||busy)&&document.activeElement!==$('#q')&&lastQ!==null&&!lastQ){run();}
    lastFiles=s.files;
  }catch(e){$('#stat').innerHTML='<span class="dot" style="background:#e5484d"></span>Lost connection to WorkSearch. Is it still running?';}
}
$('#problems').onclick=async()=>{
  const rows=await (await fetch('/api/problems')).json();
  $('#plist').innerHTML=rows.map(r=>`<li>${esc(r.rel)}<br><small>${esc(r.status==='error'?'Error: ':'')}${esc(r.note||'name only')}</small></li>`).join('')||'<li>None</li>';
  $('#dlg').showModal();
};
async function folders(){
  const f=await (await fetch('/api/folders')).json(); const cur=$('#folder').value;
  $('#folder').innerHTML='<option value="">All folders</option>'+f.map(x=>`<option value="${esc(x.name)}">${esc(x.name)} (${x.n.toLocaleString()})</option>`).join('');
  $('#folder').value=cur;
}
status();folders();run();
setInterval(status,2500);setInterval(folders,30000);
</script>
</body>
</html>
